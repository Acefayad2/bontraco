# Bontraco ships as a pure static export — every route is prerendered at build
# time and there is no server code, so there is no Next.js runtime to install.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Netlify otherwise injects a hosting-provider comment and two meta tags into
# <head>. Those extra nodes break React hydration (error #418), forcing the app
# to re-render client-side instead of hydrating the prerendered HTML.
[build.processing]
  skip_processing = true

# Long-cache the content-hashed build output.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
